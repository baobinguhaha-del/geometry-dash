<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash - Wave Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .touch-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="touchZone" class="touch-zone"></div>
</div>

<script>
// --- AUDIO SYNTHESIZER (Web Audio API) ---
class SoundEffects {
    constructor() {
        this.ctx = null;
    }
    
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playClick() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
    }

    playBeep(high = false) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(high ? 880 : 440, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playExplode() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.3);
    }

    playWin() {
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.1);
            osc.stop(this.ctx.currentTime + idx * 0.1 + 0.2);
        });
    }
}

const sounds = new SoundEffects();

// --- GAME CONFIG & CONSTANTS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const touchZone = document.getElementById('touchZone');

const GAME_WIDTH = 1280;
const GAME_HEIGHT = 720;

let scale = 1;
function resizeCanvas() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    let w = windowWidth;
    let h = windowWidth * (9 / 16);
    
    if (h > windowHeight) {
        h = windowHeight;
        w = windowHeight * (16 / 9);
    }
    
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;
    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;
    scale = w / GAME_WIDTH;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const STATE = {
    MAIN_MENU: 0,
    LEVEL_SELECT: 1,
    COUNTDOWN: 2,
    PLAYING: 3,
    GAME_OVER: 4,
    VICTORY: 5
};

let currentState = STATE.MAIN_MENU;
let isHolding = false;
let currentLevelIndex = 0;
let levelProgress = 0;

// Levels Config
const LEVELS = [
    {
        name: "STEREO MADNESS",
        difficulty: "DỄ",
        colorBg: "#001b44",
        colorTheme: "#0077ff",
        colorSecondary: "#00d4ff",
        speed: 8,
        length: 22000,
        gapHeight: 300,
        generateTerrain: function() {
            return generateLevelMap(1, this.length, this.gapHeight);
        }
    },
    {
        name: "BACK ON TRACK",
        difficulty: "TRUNG BÌNH",
        colorBg: "#003311",
        colorTheme: "#00cc44",
        colorSecondary: "#66ff88",
        speed: 9.5,
        length: 26000,
        gapHeight: 250,
        generateTerrain: function() {
            return generateLevelMap(2, this.length, this.gapHeight);
        }
    },
    {
        name: "DEMON WAVE",
        difficulty: "KHÓ",
        colorBg: "#33000d",
        colorTheme: "#ff0033",
        colorSecondary: "#ff6688",
        speed: 10,
        length: 38000, // Bản đồ kéo dài
        gapHeight: 280, // Mở rộng địa hình thoải mái
        generateTerrain: function() {
            return generateLevelMap(3, this.length, this.gapHeight);
        }
    }
];

function generateLevelMap(levelNum, totalLength, baseGap) {
    const terrain = [];
    const spikes = [];
    const sawblades = [];
    
    let x = 600;
    let currentY = GAME_HEIGHT / 2;
    
    while (x < totalLength) {
        let segLen = 400 + Math.random() * 500;
        let gap = baseGap;
        
        if (levelNum === 3) {
            let type = Math.floor(Math.random() * 3);
            if (type === 1) {
                let targetY = 200 + Math.random() * (GAME_HEIGHT - 400);
                terrain.push({ x1: x, y1: currentY, x2: x + segLen, y2: targetY, gap: gap });
                currentY = targetY;
            } else {
                terrain.push({ x1: x, y1: currentY, x2: x + segLen, y2: currentY, gap: gap });
            }
            
            // Gai nhọn bám trần/sàn
            if (Math.random() < 0.65) {
                spikes.push({
                    x: x + segLen * 0.4,
                    y: currentY - gap/2 + 20,
                    type: 'ceiling'
                });
            }
            if (Math.random() < 0.65) {
                spikes.push({
                    x: x + segLen * 0.7,
                    y: currentY + gap/2 - 20,
                    type: 'floor'
                });
            }
            
            // Bánh xe cưa xoay
            if (Math.random() < 0.5) {
                sawblades.push({
                    x: x + segLen * 0.5,
                    y: currentY + (Math.random() * 80 - 40),
                    radius: 34
                });
            }
        } else if (levelNum === 2) {
            let targetY = 200 + Math.random() * (GAME_HEIGHT - 400);
            terrain.push({ x1: x, y1: currentY, x2: x + segLen, y2: targetY, gap: gap });
            currentY = targetY;

            if (Math.random() < 0.4) {
                spikes.push({
                    x: x + segLen * 0.5,
                    y: currentY + gap/2 - 20,
                    type: 'floor'
                });
            }
        } else {
            let targetY = 220 + Math.random() * (GAME_HEIGHT - 440);
            terrain.push({ x1: x, y1: currentY, x2: x + segLen, y2: targetY, gap: gap });
            currentY = targetY;
        }
        
        x += segLen;
    }
    
    return { terrain, spikes, sawblades };
}

// Wave Physics
const wave = {
    x: 220,
    y: GAME_HEIGHT / 2,
    size: 14,
    angle: 0,
    trail: [],
    particles: [],
    
    reset() {
        this.x = 220;
        this.y = GAME_HEIGHT / 2;
        this.angle = 0;
        this.trail = [{x: this.x, y: this.y}];
        this.particles = [];
    },

    update(speed) {
        // Chuyển động chéo 45 độ: vy = speed
        const vy = isHolding ? -speed : speed;
        this.y += vy;
        this.angle = isHolding ? -Math.PI / 4 : Math.PI / 4;
        
        this.trail.push({ x: this.x, y: this.y });
        
        if (Math.random() < 0.7) {
            this.particles.push({
                x: this.x - 10,
                y: this.y + (Math.random() * 8 - 4),
                vx: -2 - Math.random() * 2,
                vy: (Math.random() - 0.5) * 2,
                size: 3 + Math.random() * 3,
                life: 1.0,
                color: LEVELS[currentLevelIndex].colorSecondary
            });
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    },

    draw(ctx) {
        // Zigzag Trail
        if (this.trail.length > 1) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = LEVELS[currentLevelIndex].colorSecondary;
            ctx.shadowBlur = 12;
            ctx.stroke();
            ctx.restore();
        }

        // Particles
        this.particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            ctx.restore();
        });

        // Wave Dart Icon
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        ctx.shadowColor = LEVELS[currentLevelIndex].colorSecondary;
        ctx.shadowBlur = 15;
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(-12, -12);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-12, 12);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = LEVELS[currentLevelIndex].colorTheme;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-6, -6);
        ctx.lineTo(-2, 0);
        ctx.lineTo(-6, 6);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }
};

let deathExplosion = [];
function triggerExplosion(x, y) {
    deathExplosion = [];
    sounds.playExplode();
    for (let i = 0; i < 40; i++) {
        let ang = Math.random() * Math.PI * 2;
        let spd = 3 + Math.random() * 9;
        deathExplosion.push({
            x: x,
            y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            size: 4 + Math.random() * 8,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 0.3,
            life: 1.0,
            color: Math.random() > 0.5 ? '#ffffff' : LEVELS[currentLevelIndex].colorTheme
        });
    }
}

let countdownValue = 3;
let countdownTimer = null;

function startCountdown() {
    currentState = STATE.COUNTDOWN;
    countdownValue = 3;
    sounds.playBeep(false);
    
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        countdownValue--;
        if (countdownValue > 0) {
            sounds.playBeep(false);
        } else if (countdownValue === 0) {
            sounds.playBeep(true);
        } else {
            clearInterval(countdownTimer);
            currentState = STATE.PLAYING;
        }
    }, 800);
}

let currentMapData = null;
let cameraX = 0;

function loadLevel(index) {
    currentLevelIndex = index;
    currentMapData = LEVELS[index].generateTerrain();
    wave.reset();
    cameraX = 0;
    levelProgress = 0;
    startCountdown();
}

let bgOffset = 0;
function drawBackground(ctx, level) {
    const bgCol = level ? level.colorBg : "#00122e";
    const gridCol = level ? level.colorTheme : "#0055ff";

    ctx.fillStyle = bgCol;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.save();
    ctx.strokeStyle = gridCol;
    ctx.globalAlpha = 0.15;
    ctx.lineWidth = 2;

    const gridSize = 80;
    bgOffset = (bgOffset + 0.5) % gridSize;

    for (let x = -bgOffset; x < GAME_WIDTH; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, GAME_HEIGHT);
        ctx.stroke();
    }
    for (let y = 0; y < GAME_HEIGHT; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(GAME_WIDTH, y);
        ctx.stroke();
    }
    ctx.restore();
}

function checkCollisions() {
    if (!currentMapData) return false;
    
    const wx = wave.x + cameraX;
    const wy = wave.y;

    let currentSegment = currentMapData.terrain.find(s => wx >= s.x1 && wx <= s.x2);
    if (currentSegment) {
        let progress = (wx - currentSegment.x1) / (currentSegment.x2 - currentSegment.x1);
        let midY = currentSegment.y1 + progress * (currentSegment.y2 - currentSegment.y1);
        let topY = midY - currentSegment.gap / 2;
        let bottomY = midY + currentSegment.gap / 2;

        if (wy - wave.size < topY || wy + wave.size > bottomY) {
            return true;
        }
    } else if (wx > 600) {
        return true;
    }

    for (let sp of currentMapData.spikes) {
        let dx = Math.abs(wx - sp.x);
        let dy = Math.abs(wy - sp.y);
        if (dx < 22 && dy < 25) {
            return true;
        }
    }

    for (let saw of currentMapData.sawblades) {
        let dx = wx - saw.x;
        let dy = wy - saw.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < saw.radius + wave.size - 4) {
            return true;
        }
    }

    return false;
}

function drawTerrain(ctx) {
    if (!currentMapData) return;
    const level = LEVELS[currentLevelIndex];

    ctx.save();
    ctx.translate(-cameraX, 0);

    currentMapData.terrain.forEach(seg => {
        if (seg.x2 < cameraX - 100 || seg.x1 > cameraX + GAME_WIDTH + 100) return;

        let topY1 = seg.y1 - seg.gap / 2;
        let topY2 = seg.y2 - seg.gap / 2;
        let botY1 = seg.y1 + seg.gap / 2;
        let botY2 = seg.y2 + seg.gap / 2;

        ctx.fillStyle = level.colorBg;
        ctx.beginPath();
        ctx.moveTo(seg.x1, 0);
        ctx.lineTo(seg.x2, 0);
        ctx.lineTo(seg.x2, topY2);
        ctx.lineTo(seg.x1, topY1);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = level.colorTheme;
        ctx.lineWidth = 4;
        ctx.shadowColor = level.colorTheme;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(seg.x1, topY1);
        ctx.lineTo(seg.x2, topY2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(seg.x1, GAME_HEIGHT);
        ctx.lineTo(seg.x2, GAME_HEIGHT);
        ctx.lineTo(seg.x2, botY2);
        ctx.lineTo(seg.x1, botY1);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(seg.x1, botY1);
        ctx.lineTo(seg.x2, botY2);
        ctx.stroke();
    });

    currentMapData.spikes.forEach(sp => {
        if (sp.x < cameraX - 50 || sp.x > cameraX + GAME_WIDTH + 50) return;
        ctx.save();
        ctx.fillStyle = "#ff2200";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (sp.type === 'ceiling') {
            ctx.moveTo(sp.x - 18, sp.y - 20);
            ctx.lineTo(sp.x + 18, sp.y - 20);
            ctx.lineTo(sp.x, sp.y + 15);
        } else {
            ctx.moveTo(sp.x - 18, sp.y + 20);
            ctx.lineTo(sp.x + 18, sp.y + 20);
            ctx.lineTo(sp.x, sp.y - 15);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    });

    let sawAngle = Date.now() * 0.005;
    currentMapData.sawblades.forEach(saw => {
        if (saw.x < cameraX - 100 || saw.x > cameraX + GAME_WIDTH + 100) return;
        ctx.save();
        ctx.translate(saw.x, saw.y);
        ctx.rotate(sawAngle);

        ctx.fillStyle = '#111';
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 12;

        ctx.beginPath();
        const teeth = 8;
        for (let i = 0; i < teeth; i++) {
            let a1 = (i / teeth) * Math.PI * 2;
            let a2 = ((i + 0.5) / teeth) * Math.PI * 2;
            ctx.lineTo(Math.cos(a1) * saw.radius, Math.sin(a1) * saw.radius);
            ctx.lineTo(Math.cos(a2) * (saw.radius - 10), Math.sin(a2) * (saw.radius - 10));
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });

    ctx.restore();
}

function renderMainMenu() {
    drawBackground(ctx, null);

    ctx.save();
    ctx.textAlign = 'center';
    
    ctx.font = '900 78px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#000000';
    ctx.fillText('GEOMETRY DASH', GAME_WIDTH / 2 + 5, 185);
    
    let grad = ctx.createLinearGradient(0, 100, 0, 190);
    grad.addColorStop(0, '#ccff00');
    grad.addColorStop(0.5, '#a2ff00');
    grad.addColorStop(1, '#009900');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.fillText('GEOMETRY DASH', GAME_WIDTH / 2, 180);
    ctx.strokeText('GEOMETRY DASH', GAME_WIDTH / 2, 180);

    ctx.font = '900 32px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#ffff00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.fillText('TRY ME!', GAME_WIDTH / 2 + 160, 235);
    ctx.strokeText('TRY ME!', GAME_WIDTH / 2 + 160, 235);

    // Nút Play duy nhất
    const cx = GAME_WIDTH / 2;
    const cy = GAME_HEIGHT / 2 + 50;
    
    ctx.shadowColor = 'rgba(0, 255, 100, 0.4)';
    ctx.shadowBlur = 25;

    ctx.fillStyle = '#22cc33';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    
    ctx.beginPath();
    ctx.roundRect(cx - 35, cy - 85, 70, 170, 10);
    ctx.roundRect(cx - 85, cy - 35, 170, 70, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#00cccc';
    ctx.fillRect(cx - 75, cy - 75, 35, 35);
    ctx.fillRect(cx + 40, cy - 75, 35, 35);
    ctx.fillRect(cx - 75, cy + 40, 35, 35);
    ctx.fillRect(cx + 40, cy + 40, 35, 35);

    ctx.fillStyle = '#ffea00';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - 20, cy - 35);
    ctx.lineTo(cx + 35, cy);
    ctx.lineTo(cx - 20, cy + 35);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

function renderLevelSelect() {
    const level = LEVELS[currentLevelIndex];
    drawBackground(ctx, level);

    ctx.save();
    ctx.textAlign = 'center';

    const cx = GAME_WIDTH / 2;
    const cy = GAME_HEIGHT / 2;

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeStyle = level.colorTheme;
    ctx.lineWidth = 6;
    ctx.shadowColor = level.colorTheme;
    ctx.shadowBlur = 20;
    ctx.roundRect(cx - 280, cy - 160, 560, 320, 20);
    ctx.fill();
    ctx.stroke();

    ctx.font = '900 42px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(level.name, cx, cy - 70);

    ctx.font = '700 28px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = level.colorSecondary;
    ctx.fillText(`ĐỘ KHÓ: ${level.difficulty}`, cx, cy - 10);

    ctx.font = '600 22px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#cccccc';
    ctx.fillText('CHẾ ĐỘ: WAVE 45°', cx, cy + 40);

    ctx.fillStyle = '#22cc33';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy + 100, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffea00';
    ctx.beginPath();
    ctx.moveTo(cx - 10, cy + 85);
    ctx.lineTo(cx + 18, cy + 100);
    ctx.lineTo(cx - 10, cy + 115);
    ctx.closePath();
    ctx.fill();

    ctx.font = '900 60px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('‹', cx - 330, cy + 20);
    ctx.fillText('›', cx + 330, cy + 20);

    ctx.font = '700 20px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText('QUAY LẠI [ESC]', cx, cy + 220);

    ctx.restore();
}

function renderHUD() {
    const level = LEVELS[currentLevelIndex];

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.fillRect(GAME_WIDTH / 2 - 200, 20, 400, 16);
    ctx.strokeRect(GAME_WIDTH / 2 - 200, 20, 400, 16);

    ctx.fillStyle = level.colorTheme;
    ctx.fillRect(GAME_WIDTH / 2 - 198, 22, (396 * levelProgress) / 100, 12);

    ctx.font = '700 16px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.floor(levelProgress)}%`, GAME_WIDTH / 2, 53);

    if (currentState === STATE.COUNTDOWN) {
        ctx.textAlign = 'center';
        ctx.font = '900 110px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#ffea00';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 6;
        
        let text = countdownValue > 0 ? countdownValue : "GO!";
        ctx.fillText(text, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 35);
        ctx.strokeText(text, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 35);
    }

    ctx.restore();
}

function renderEndScreens() {
    ctx.save();
    ctx.textAlign = 'center';

    if (currentState === STATE.GAME_OVER) {
        deathExplosion.forEach(p => {
            ctx.save();
            ctx.translate(p.x - cameraX, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
        });

        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, GAME_HEIGHT / 2 - 100, GAME_WIDTH, 200);

        ctx.font = '900 64px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#ff2200';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.fillText('THỬ LẠI!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);
        ctx.strokeText('THỬ LẠI!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 10);

        ctx.font = '700 24px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CHẠM HOẶC BẤM SPACE ĐỂ CHƠI LẠI', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);

    } else if (currentState === STATE.VICTORY) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        ctx.font = '900 70px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#00ff66';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.fillText('HOÀN THÀNH!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 30);
        ctx.strokeText('HOÀN THÀNH!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 30);

        ctx.font = '700 26px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CHÚC MỪNG BẠN ĐÃ VƯỢT QUA MÀN CHƠI!', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 30);
        ctx.fillText('CHẠM VÀO MÀN HÌNH ĐỂ VỀ MENU', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 80);
    }

    ctx.restore();
}

function update() {
    if (currentState === STATE.PLAYING) {
        const level = LEVELS[currentLevelIndex];
        cameraX += level.speed;
        wave.update(level.speed);

        levelProgress = Math.min(100, (cameraX / level.length) * 100);

        if (checkCollisions()) {
            currentState = STATE.GAME_OVER;
            triggerExplosion(wave.x + cameraX, wave.y);
        }

        if (cameraX >= level.length) {
            currentState = STATE.VICTORY;
            sounds.playWin();
        }
    } else if (currentState === STATE.GAME_OVER) {
        deathExplosion.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vrot;
        });
    }
}

function render() {
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    if (currentState === STATE.MAIN_MENU) {
        renderMainMenu();
    } else if (currentState === STATE.LEVEL_SELECT) {
        renderLevelSelect();
    } else {
        drawBackground(ctx, LEVELS[currentLevelIndex]);
        drawTerrain(ctx);
        if (currentState !== STATE.GAME_OVER) {
            wave.draw(ctx);
        }
        renderHUD();
        if (currentState === STATE.GAME_OVER || currentState === STATE.VICTORY) {
            renderEndScreens();
        }
    }
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

function handlePress(e) {
    sounds.init();

    if (currentState === STATE.MAIN_MENU) {
        sounds.playClick();
        currentState = STATE.LEVEL_SELECT;
    } else if (currentState === STATE.LEVEL_SELECT) {
        let rect = canvas.getBoundingClientRect();
        let clickX = (e.clientX - rect.left) / scale;

        const cx = GAME_WIDTH / 2;

        if (clickX < cx - 200) {
            sounds.playClick();
            currentLevelIndex = (currentLevelIndex - 1 + LEVELS.length) % LEVELS.length;
        } else if (clickX > cx + 200) {
            sounds.playClick();
            currentLevelIndex = (currentLevelIndex + 1) % LEVELS.length;
        } else {
            sounds.playClick();
            loadLevel(currentLevelIndex);
        }
    } else if (currentState === STATE.COUNTDOWN || currentState === STATE.PLAYING) {
        isHolding = true;
    } else if (currentState === STATE.GAME_OVER) {
        sounds.playClick();
        loadLevel(currentLevelIndex);
    } else if (currentState === STATE.VICTORY) {
        sounds.playClick();
        currentState = STATE.LEVEL_SELECT;
    }
}

function handleRelease() {
    isHolding = false;
}

touchZone.addEventListener('mousedown', (e) => handlePress(e));
touchZone.addEventListener('mouseup', handleRelease);
touchZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handlePress(e.touches[0]);
});
touchZone.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleRelease();
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (!isHolding) handlePress({ clientX: window.innerWidth/2, clientY: window.innerHeight/2 });
    } else if (e.code === 'Escape') {
        if (currentState === STATE.LEVEL_SELECT) {
            currentState = STATE.MAIN_MENU;
        } else if (currentState === STATE.PLAYING || currentState === STATE.COUNTDOWN) {
            currentState = STATE.LEVEL_SELECT;
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        handleRelease();
    }
});

gameLoop();
</script>
</body>
</html>
